services:
  base:
    image: postgres:16
    environment:
      POSTGRES_DB: compteur
      POSTGRES_USER: compteur
      POSTGRES_PASSWORD: motdepasse_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - donnees_base:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compteur -d compteur"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  donnees_base: