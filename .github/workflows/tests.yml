# Intégration continue : à chaque envoi sur GitHub, on vérifie tout sur des machines neuves.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Démarrer la base de données
        run: docker compose up --wait base

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les bibliothèques
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  parcours:
    name: Parcours complet (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire et démarrer la base et le service
        run: docker compose up --build --wait

      - name: Parcours utilisateur par HTTP
        run: |
          curl --fail-with-body http://127.0.0.1:8000/sante
          curl --fail-with-body -F "fichier=@tests/trois_carres.png" http://127.0.0.1:8000/images
          curl --fail-with-body -H "Content-Type: application/json" -d '{"seuil": 128}' -o analyse.json http://127.0.0.1:8000/images/1/analyses
          cat analyse.json
          grep -q '"nb_objets":3' analyse.json
          curl --fail-with-body -o /dev/null http://127.0.0.1:8000/images/1/fichier

      - name: Afficher les messages des conteneurs en cas d'échec
        if: failure()
        run: docker compose logs